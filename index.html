<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SC 货舱装载参考图</title>
    <style>
      /* 下面的变量只是兜底值：真正的配色在 js/theme.js 的 ui 里，
         启动时会被写进来覆盖，改色只需改 theme.js。 */
      :root {
        --bg: #0e1319;
        --panel: #151c25;
        --panel2: #1b2430;
        --border: #26323f;
        --text: #dbe4ee;
        --textDim: #8494a5;
        --accent: #2f9fe0;
        --accentDim: #1d5f87;
        --ok: #2fb26a;
        --danger: #e04848;
        --warn: #d9a521;
        --shadow: rgba(0, 0, 0, 0.35);
        --font: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
        --mono: "DejaVu Sans Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 var(--font);
        overflow: hidden;
      }

      /* ---------------------------------------------------------- 顶栏 */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.3px;
        font-size: 14px;
        white-space: nowrap;
      }
      .brand span {
        color: var(--textDim);
        font-weight: 400;
        font-size: 11px;
        margin-left: 6px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .field > label,
      .mini {
        color: var(--textDim);
        font-size: 11px;
      }
      select,
      input[type="number"] {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 7px;
        font: inherit;
        font-size: 12px;
        outline: none;
      }
      select:focus,
      input:focus {
        border-color: var(--accentDim);
      }
      #ship {
        max-width: 230px;
      }
      #grid {
        max-width: 240px;
      }
      #gridMeta {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
      }
      #maxNote {
        color: var(--warn);
        font-size: 11px;
      }
      input[type="number"] {
        width: 52px;
        text-align: center;
        font-family: var(--mono);
      }
      .spacer {
        flex: 1;
      }

      /* ---------------------------------------------------------- 按钮 */
      .btn {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--accentDim);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .btn.primary {
        background: var(--accentDim);
        border-color: var(--accentDim);
      }
      .btn.danger:hover:not(:disabled) {
        border-color: var(--danger);
        color: #ffb3b3;
      }
      .seg {
        display: inline-flex;
        gap: 2px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px;
      }
      .seg button {
        background: none;
        border: 0;
        color: var(--textDim);
        font: inherit;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .seg button.active {
        background: var(--accentDim);
        color: #fff;
      }

      /* ---------------------------------------------------------- 主体 */
      main {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 244px minmax(0, 1fr) 332px;
        gap: 10px;
        padding: 10px;
        min-height: 0;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .panel > .head {
        padding: 8px 11px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--textDim);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex: 0 0 auto;
      }
      .panel > .body {
        padding: 10px;
        overflow: auto;
        min-height: 0;
      }
      .dim {
        color: var(--textDim);
        font-size: 11px;
      }

      /* ---------------------------------------------------------- 箱型列表 */
      #palette {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .pal {
        display: grid;
        grid-template-columns: 14px 1fr auto;
        align-items: center;
        gap: 8px;
        text-align: left;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 8px;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .pal:hover:not(:disabled) {
        border-color: var(--accentDim);
      }
      .pal.active {
        border-color: var(--c);
        box-shadow: inset 0 0 0 1px var(--c);
        background: #1f2a37;
      }
      .pal:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .pal .sw {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: var(--c);
        border: 1px solid rgba(0, 0, 0, 0.4);
      }
      .pal .nm {
        font-size: 12px;
        font-weight: 600;
      }
      .pal .dim {
        display: block;
        font-size: 10.5px;
        color: var(--textDim);
        font-family: var(--mono);
      }
      .pal .cnt {
        font-size: 10.5px;
        color: var(--textDim);
        font-family: var(--mono);
        white-space: nowrap;
      }

      /* ---------------------------------------------------------- 编辑区 */
      .editor-panel {
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 12px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        flex-wrap: wrap;
      }
      #cursorLine {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--textDim);
      }
      #editorWrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #editor {
        display: block;
        cursor: crosshair;
        border-radius: 6px;
      }
      #layerRange {
        width: 100%;
        accent-color: var(--accent);
      }

      /* ---------------------------------------------------------- 右栏 */
      .stat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }
      .stat b {
        font-family: var(--mono);
        font-size: 15px;
      }
      #statPct {
        color: var(--accent);
        font-family: var(--mono);
        font-weight: 700;
      }
      .bar {
        height: 7px;
        border-radius: 4px;
        background: var(--panel2);
        overflow: hidden;
        border: 1px solid var(--border);
        margin: 6px 0 10px;
      }
      #statBar {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #2f9fe0, #2fb26a);
        transition: width 0.12s ease-out;
      }
      #statSize {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--textDim);
        word-spacing: 2px;
      }
      #previewWrap {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 120px;
      }
      #preview {
        display: block;
      }
      .export-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        align-items: center;
      }
      .export-grid select {
        width: 100%;
      }
      .iso-opts {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--textDim);
      }
      /* 作者样式里的 display 会盖掉 hidden，需要单独还原 */
      .iso-opts[hidden] {
        display: none;
      }
      .iso-opts label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      .iso-opts input[type="checkbox"] {
        margin: 0;
        accent-color: var(--accent);
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .hint {
        font-size: 11px;
        color: var(--textDim);
        line-height: 1.7;
      }
      .hint kbd {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 4px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--text);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* ---------------------------------------------------------- toast */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 20px);
        background: #000d;
        color: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s, transform 0.18s;
        z-index: 50;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 1100px) {
        main {
          grid-template-columns: 210px minmax(0, 1fr) 280px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">SC 货舱装载参考图 <span id="shipCount"></span></div>

      <div class="field">
        <label for="ship">船只</label>
        <select id="ship"></select>
      </div>

      <div class="field">
        <label for="grid">网格</label>
        <select id="grid"></select>
      </div>

      <div class="field">
        <span id="gridMeta">—</span>
        <span id="maxNote"></span>
      </div>

      <div class="spacer"></div>

      <div class="field">
        <span class="mini">自定义</span>
        <input id="cx" type="number" min="1" max="200" value="5" title="X 格数" />
        <input id="cy" type="number" min="1" max="200" value="8" title="Y 格数" />
        <input id="cz" type="number" min="1" max="200" value="3" title="Z 格数（竖直）" />
        <button class="btn" id="useCustom">使用</button>
      </div>
    </header>

    <main>
      <!-- 左：箱型 -->
      <section class="panel">
        <div class="head">
          <span>货箱</span>
          <span id="yawTag" class="dim"></span>
        </div>
        <div class="body">
          <div id="palette"></div>

          <div style="margin-top: 12px">
            <div class="dim" style="margin-bottom: 5px">落箱锚点</div>
            <div class="seg">
              <button data-anchor="center" class="active">居中</button>
              <button data-anchor="corner">左下角</button>
            </div>
          </div>

          <div style="margin-top: 14px">
            <div class="dim" style="margin-bottom: 5px">层（竖直）</div>
            <div id="layerLabel" class="dim" style="font-family: var(--mono)"></div>
            <input id="layerRange" type="range" min="0" max="0" value="0" />
          </div>

          <div style="margin-top: 14px" class="row2">
            <button class="btn" id="btnUndo" disabled>撤销</button>
            <button class="btn" id="btnRedo" disabled>重做</button>
          </div>
          <div style="margin-top: 6px">
            <button class="btn danger" id="btnClear" style="width: 100%">清空当前网格</button>
          </div>

          <div class="hint" style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 10px">
            <kbd>左键</kbd> 放置 · <kbd>右键</kbd> 删除<br />
            <kbd>拖动</kbd> 移动已有货箱<br />
            <kbd>R</kbd> 旋转（选中时转该箱）<br />
            <kbd>1</kbd>–<kbd>7</kbd> 选箱型 · <kbd>[</kbd> <kbd>]</kbd> 切层<br />
            <kbd>滚轮</kbd> 切层 · <kbd>Del</kbd> 删除选中<br />
            <kbd>方向键</kbd> 微调 · <kbd>Ctrl+Z</kbd> 撤销
          </div>
        </div>
      </section>

      <!-- 中：编辑区 -->
      <section class="panel editor-panel">
        <div class="toolbar">
          <span id="cursorLine">左键放置 · 右键删除 · R 旋转 · 滚轮切层</span>
        </div>
        <div id="editorWrap"><canvas id="editor"></canvas></div>
      </section>

      <!-- 右：统计 / 预览 / 导出 -->
      <section class="panel">
        <div class="head"><span>统计</span><span id="statPct">0%</span></div>
        <div class="body stack">
          <div>
            <div class="stat">
              <b id="statFill">0 / 0 SCU</b>
            </div>
            <div class="bar"><div id="statBar"></div></div>
            <div class="stat dim">
              <span id="statCrates">0 件</span>
            </div>
            <div id="statSize" style="margin-top: 4px">—</div>
          </div>

          <div>
            <div class="dim" style="margin-bottom: 5px">等距预览</div>
            <div id="previewWrap"><canvas id="preview"></canvas></div>
          </div>

          <div>
            <div class="dim" style="margin-bottom: 6px">导出</div>
            <div class="export-grid" style="margin-bottom: 6px">
              <select id="expKind">
                <option value="layers">分层图（推荐）</option>
                <option value="iso">等距立体图</option>
                <option value="ortho">三视图</option>
              </select>
              <select id="expScope">
                <option value="grid">当前网格</option>
                <option value="ship">整船货舱</option>
              </select>
            </div>
            <div id="isoOpts" class="iso-opts" hidden>
              <label><input id="expTransparent" type="checkbox" />透明背景</label>
              <label><input id="expNoLegend" type="checkbox" />隐藏图例</label>
            </div>
            <div class="row2" style="margin-bottom: 6px">
              <button class="btn primary" id="btnPNG">PNG</button>
              <button class="btn" id="btnSVG">SVG</button>
            </div>
            <div class="row2">
              <button class="btn" id="btnJSON">导出方案</button>
              <label class="btn" for="fileJSON" style="text-align: center">导入方案</label>
              <input id="fileJSON" type="file" accept=".json,application/json" hidden />
            </div>
          </div>

          <div class="hint">
            方案会自动存在浏览器里，换网格再切回来不会丢。截图不方便时优先导出 SVG（文字不会糊）。
          </div>
        </div>
      </section>
    </main>

    <div id="toast"></div>

    <script src="js/theme.js"></script>
    <script src="js/model.js"></script>
    <script src="js/render.js"></script>
    <script src="ships.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
