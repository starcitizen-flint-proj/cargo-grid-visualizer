[project]
name = "cargo-grid-visualizer"
version = "0.1.0"
description = "星际公民货舱装载参考图编辑器（前端零依赖，Python 只用来生成预设）"
requires-python = ">=3.14"
dependencies = []

# 说明：前端是纯静态文件，Python 侧只有 tools/gen_ships.py 一个标准库脚本，
# 因此不引入 build-system。环境相关设置统一放 uv.toml。

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["tools", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=tools",
    "--cov-fail-under=70",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
]
