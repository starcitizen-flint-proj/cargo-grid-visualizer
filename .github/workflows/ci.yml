name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # 不覆盖 uv.toml 的 index：uv.lock 里的包地址与该索引绑定，
      # 换索引会让 --locked 判定 lock 过期（实测 CI 直接失败）。
      - name: 安装依赖
        run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: typecheck
        run: uv run mypy .

      - name: test
        run: uv run pytest --cov --cov-fail-under=70
